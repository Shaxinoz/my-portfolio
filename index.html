<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asosiy - Portfio</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <header class="navbar">
      <div class="logo">
        <h3>Shahnoza <span>Portfoliosi</span></h3>
      </div>

      <nav class="nav-links">
        <a href="index.html" class="active">Asosiy</a>
        <a href="#">Men haqimda</a>
        <a href="#">Kontakt</a>
      </nav>

      <div class="nav-btn">
        <button class="btn-primary">Meni yollang</button>
      </div>
    </header>

    <main class="main-margin">
      <section class="hero-block">
        <div class="hero-avatar">
          <!-- Ishlaydigan rasm havolasi -->
          <img src="https://picsum.photos/150" alt="Shahnoza rasmi" />
        </div>
        <div class="hero-content">
          <h1>Shahnoza</h1>
          <p class="hero-title">Backend Developer</p>
          <p class="hero-description">
            Men oddiy va foydali veb saytlar yaratishni yoqtiraman. Yangi
            narsalarni o'rganishga qiziqaman va amaliyot qilish orqali o'saman.
          </p>
          <button class="btn-works">Mening ishlarim</button>
        </div>
      </section>

      <!-- Pastki bloklar -->
      <div class="bottom-blocks">
        <!-- Texnologiyalar qismi -->
        <section class="tech-block">
          <h3>Men biladigan texnologiyalar</h3>
          <div class="tech-tags">
            <span class="tag">HTML</span>
            <span class="tag">CSS</span>
            <span class="tag">JavaScript</span>
          </div>
        </section>

        <!-- Mini sanagich qismi -->
        <section class="counter-block">
          <h3>Mini Funksiya: Counter</h3>
          <div class="counter-box">
            <div class="counter-number">12</div>
            <div class="counter-buttons">
              <button class="btn-counter">-</button>
              <button class="btn-reset">Qaytarish</button>
              <button class="btn-counter">+</button>
            </div>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
